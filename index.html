<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<title>FABLO — Fabulous snacking, naturally</title>
<meta name="description" content="Meet FABLO roasted makhana: a fabulous little crunch made for your everyday moments.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="wa" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.3 0-.4.1-.6l.4-.4.2-.4v-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3a2.9 2.9 0 0 0-.9 2.1c0 1.300.9 2.5 1 2.700.1.2 1.8 2.8 4.4 3.9 1.600.7 2.200.8 3 .6.5-.1 1.5-.6 1.7-1.2s.2-1.100.1-1.2-.3-.2-.5-.3Z"/></symbol></svg>
<div class="progress" id="progress"></div>
<div class="film" id="film" aria-hidden="true">
  <video id="filmVideo" src="assets/video/fablo-background.mp4" poster="assets/images/video-poster.jpg" muted loop playsinline preload="auto"></video>
  <div class="film-shade"></div>
</div>
<header class="wrap">
  <a class="brand" href="#home">FABL<span>O</span></a>
  <nav class="nav" id="nav"></nav>
  <a id="headerCta"></a>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
</header>
<main>
<section class="hero" id="home">
  <canvas class="sparks" id="sparks" aria-hidden="true"></canvas>
  <div class="wrap hero-inner">
    <div class="hero-copy" id="heroCopy">
      <div class="eyebrow" data-c="hero.eyebrow"></div>
      <h1><span class="line"><span data-c="hero.titleLine1"></span></span><span class="line"><span><em data-c="hero.titleLine2"></em></span></span></h1>
      <p data-c="hero.text"></p>
      <div class="actions" id="heroActions"></div>
    </div>
    <div class="player" id="player" role="group" aria-label="Background video controls">
      <div class="chapters" id="chapters"></div>
      <div class="player-bar">
        <button class="icon-btn" id="playBtn" type="button" aria-label="Pause video"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/><path class="i-play" d="M8 5v14l11-7z"/></svg></button>
        <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek video">
        <button class="icon-btn" id="muteBtn" type="button" aria-label="Turn sound on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="i-waves" d="M15.500 8.500a5 5 0 0 1 0 7l-1-1a3.600 3.600 0 0 0 0-5zM17.800 6.200a8.200 8.200 0 0 1 0 11.600l-1-1a6.800 6.800 0 0 0 0-9.600z"/><path class="i-x" d="m15 9.700 1-1 2.300 2.300 2.300-2.300 1 1-2.300 2.300 2.300 2.300-1 1-2.300-2.300-2.300 2.300-1-1 2.300-2.300z"/></svg></button>
      </div>
      <p class="player-hint" data-c="hero.playerHint"></p>
    </div>
  </div>
</section>
<div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>
<section id="snacks" class="band"><div class="wrap">
  <div class="section-top"><div class="eyebrow" data-c="flavours.eyebrow"></div><h2 data-c="flavours.title"></h2><p data-c="flavours.text"></p></div>
  <div class="flavors" id="flavors"></div>
</div></section>
<section class="story" id="story"><div class="wrap story-inner">
  <div class="story-art"><div class="circle"></div><div class="big-word" data-c="story.artWord"></div><div class="spark a">✦</div><div class="spark b">✧</div></div>
  <div class="story-copy"><div class="eyebrow" data-c="story.eyebrow"></div><h2 id="storyTitle"></h2><div id="storyText" style="display:contents"></div></div>
</div></section>
<section id="why" class="band"><div class="wrap">
  <div class="section-top"><div class="eyebrow" data-c="values.eyebrow"></div><h2 data-c="values.title"></h2><p data-c="values.text"></p></div>
  <div class="values" id="values"></div>
  <div class="why-cta reveal" id="whyCta"></div>
</div></section>
<section class="cta" id="connect"><div class="eyebrow" data-c="connect.eyebrow"></div><h2 data-c="connect.title"></h2><p id="connectText"></p><div class="cta-actions" id="connectActions"></div></section>
</main>
<footer><div class="wrap foot"><div><a class="brand" href="#home">FABL<span>O</span></a><p data-c="footer.copyright"></p></div><div class="foot-links" id="footLinks"></div></div></footer>
<a id="waFab"></a>
<script src="js/content.js"></script>
</body>
</html>
